- Fleet:
    # Disk use per host from the central Prometheus (node exporter via each
    # host's agent). Homepage runs on hwc-work, so this is how it sees the
    # server's DAS; the container reaches Prometheus on the host.
    - hwc-server:
        icon: mdi-server
        description: Media + storage host
        widget:
          type: prometheusmetric
          url: http://host.containers.internal:9090
          refreshInterval: 60000
          metrics:
            - label: Root
              query: 100 - 100 * node_filesystem_avail_bytes{host="hwc-server",mountpoint="/"} / node_filesystem_size_bytes{host="hwc-server",mountpoint="/"}
              format:
                type: percent
            - label: Hot
              query: 100 - 100 * node_filesystem_avail_bytes{host="hwc-server",mountpoint="/mnt/hot"} / node_filesystem_size_bytes{host="hwc-server",mountpoint="/mnt/hot"}
              format:
                type: percent
            - label: Media
              query: 100 - 100 * node_filesystem_avail_bytes{host="hwc-server",mountpoint="/mnt/media"} / node_filesystem_size_bytes{host="hwc-server",mountpoint="/mnt/media"}
              format:
                type: percent
            - label: Backup
              query: 100 - 100 * node_filesystem_avail_bytes{host="hwc-server",mountpoint="/mnt/backup"} / node_filesystem_size_bytes{host="hwc-server",mountpoint="/mnt/backup"}
              format:
                type: percent
    - hwc-work:
        icon: mdi-server-network
        description: Work + development host
        widget:
          type: prometheusmetric
          url: http://host.containers.internal:9090
          refreshInterval: 60000
          metrics:
            - label: Root
              query: 100 - 100 * node_filesystem_avail_bytes{host="hwc-work",mountpoint="/"} / node_filesystem_size_bytes{host="hwc-work",mountpoint="/"}
              format:
                type: percent

