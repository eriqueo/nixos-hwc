- search:
    provider: google
    target: _blank
# Local resources are the host Homepage runs on (hwc-work). Other hosts'
# disks come from the central Prometheus — see the Fleet tiles.
- resources:
    cpu: true
    memory: true
    disk: /
    label: hwc-work
- datetime:
    text_size: xl
    format:
      dateStyle: short
      timeStyle: short
