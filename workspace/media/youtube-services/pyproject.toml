[project]
name = "youtube-services"
version = "0.1.0"
description = "YouTube transcript and video download services for hwc-home"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
